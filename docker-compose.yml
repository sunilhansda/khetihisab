services:
  postgres:
    image: postgres:17
    container_name: khetihisab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: khetihisab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - khetihisab-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d khetihisab"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  khetihisab-postgres-data:
